<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>사면관상체四面觀相體</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #ff0000;
      }
      body {
        display: grid;
        place-items: center;
      }
      img {
        display: none;
        max-width: min(92vw, 640px);
        max-height: 92vh;
        object-fit: contain;
      }
      img.is-on {
        display: block;
      }
    </style>
  </head>
  <body>
    <img alt="" referrerpolicy="no-referrer" />
    <script>
      const raw = new URLSearchParams(location.search).get("src") || "";
      const img = document.querySelector("img");
      const tried = new Set();
      const list = [];
      const add = (href) => {
        if (!href || tried.has(href)) return;
        tried.add(href);
        list.push(href);
      };
      try {
        const url = new URL(raw);
        if (url.protocol === "https:" && url.hostname.endsWith("tmpfiles.org")) {
          add(url.href);
          if (url.pathname.startsWith("/dl/")) {
            add(`${url.origin}${url.pathname.replace(/^\/dl/, "")}${url.search}`);
          } else {
            add(`${url.origin}/dl${url.pathname}${url.search}`);
          }
        }
      } catch (error) {}
      let i = 0;
      img.onload = () => img.classList.add("is-on");
      img.onerror = () => {
        i += 1;
        if (i < list.length) img.src = list[i];
      };
      if (list[0]) img.src = list[0];
    </script>
  </body>
</html>
